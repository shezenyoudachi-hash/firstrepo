name: TVGuide
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TVGuide:
    type: application
    platform: iOS
    sources:
      - TVGuide
    info:
      path: TVGuide/Info.plist
      properties:
        CFBundleDisplayName: 番組表
        CFBundleDevelopmentRegion: ja
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 自宅の録画サーバー（Mirakurun など）から番組表を取得するために使用します。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).TVGuide
        GENERATE_INFOPLIST_FILE: NO
  TVGuideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TVGuideTests
    dependencies:
      - target: TVGuide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).TVGuideTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TVGuide:
    build:
      targets:
        TVGuide: all
        TVGuideTests: [test]
    test:
      targets:
        - TVGuideTests
